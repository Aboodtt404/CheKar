[project]
name = "carcheck"
version = "0.1.0"
description = "AI-powered used car inspection for the Egyptian market"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "Pillow>=10.0",
    "openai>=1.0",
    "ultralytics>=8.3",
    "weasyprint>=62.0",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.6",
    "jinja2>=3.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.9",
    "huey>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
carcheck = "carcheck.cli:app"

[tool.setuptools.packages.find]
include = ["carcheck*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["carcheck/tests"]
pythonpath = ["."]
